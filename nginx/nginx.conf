# ==========================================================
# HARDENED HIGH-AVAILABILITY NGINX LOAD BALANCER CONFIGURATION
# Features:
#   1. Round-Robin Distribution across 3 Backend Instances
#   2. Zero-Downtime Failover (proxy_next_upstream)
#   3. Upstream Passive Health Monitoring (max_fails / fail_timeout)
#   4. Response Header Forwarding for Instance Inspection
# ==========================================================

events {
    worker_connections 2048;
}

http {
    # Logging configuration
    log_format upstreamlog '[$time_local] $remote_addr to: $upstream_addr: $request status: $status (upstream_status: $upstream_status) rt: $request_time uct: $upstream_connect_time';
    access_log /var/log/nginx/access.log upstreamlog;

    upstream backend_cluster {
        # Passive health checking: mark down after 1 failed attempt for 10 seconds
        server backend1:5000 max_fails=1 fail_timeout=10s;
        server backend2:5000 max_fails=1 fail_timeout=10s;
        server backend3:5000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ====================================================
            # ZERO-DOWNTIME FAILOVER CONFIGURATION (Question 1c)
            # Reroutes failed requests automatically to healthy nodes
            # ====================================================
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Quick failover connection timeout
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;

            # Pass instance identification headers to client
            add_header X-Served-By-Nginx $hostname always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }

        # Nginx status endpoint for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
}
