version: '3.8'

services:
  # ==========================================================
  # BACKEND INSTANCE 1
  # ==========================================================
  backend1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hostelfix-backend-1
    environment:
      - PORT=5000
      - INSTANCE_ID=HostelFix-Backend-1
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "5001:5000"
    restart: unless-stopped
    networks:
      - hostelfix-network

  # ==========================================================
  # BACKEND INSTANCE 2
  # ==========================================================
  backend2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hostelfix-backend-2
    environment:
      - PORT=5000
      - INSTANCE_ID=HostelFix-Backend-2
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "5002:5000"
    restart: unless-stopped
    networks:
      - hostelfix-network

  # ==========================================================
  # BACKEND INSTANCE 3
  # ==========================================================
  backend3:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hostelfix-backend-3
    environment:
      - PORT=5000
      - INSTANCE_ID=HostelFix-Backend-3
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "5003:5000"
    restart: unless-stopped
    networks:
      - hostelfix-network

  # ==========================================================
  # NGINX LOAD BALANCER & REVERSE PROXY
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: hostelfix-nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    networks:
      - hostelfix-network

networks:
  hostelfix-network:
    driver: bridge
